<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/favicon.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Promaxify | Corporate Branding & Custom Solutions</title>

    <meta
      name="description"
      content="Promaxify provides customized corporate solutions, branded apparel, promotional products and business solutions."
    />

    <!-- GitHub Pages SPA route restoration -->
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);

        if (params.get("redirect") !== "true") {
          return;
        }

        const pathname = params.get("pathname") || "/";
        const query = params.get("query") || "";
        const hash = params.get("hash") || "";

        const newUrl =
          pathname +
          (query ? "?" + query : "") +
          (hash ? "#" + hash : "");

        window.history.replaceState(null, "", newUrl);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
