<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <script>
    (function () {
      var l = window.location;

      var pathname = l.pathname
        .split("/")
        .join("%2F");

      var query = l.search
        .slice(1)
        .split("&")
        .join("~and~");

      var hash = l.hash
        .slice(1);

      var redirect =
        l.protocol +
        "//" +
        l.host +
        "/?/" +
        pathname +
        (query ? "?" + query : "") +
        (hash ? "#" + hash : "");

      window.location.replace(redirect);
    })();
  </script>
</head>

<body>
  Redirecting...
</body>

</html>
